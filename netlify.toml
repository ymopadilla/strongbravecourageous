[build]
  command = "npm run build && node scripts/algolia-index.js"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Search index + feed must never be cached long
[[headers]]
  for = "/feed.xml"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Content-Type = "application/rss+xml; charset=utf-8"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Long cache for static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Friendly URLs
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
[[redirects]]
  from = "/stories"
  to = "/stories.html"
  status = 200
[[redirects]]
  from = "/scripture"
  to = "/scripture.html"
  status = 200
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
[[redirects]]
  from = "/fingerprints"
  to = "/fingerprints.html"
  status = 200
[[redirects]]
  from = "/newsletter"
  to = "/newsletter.html"
  status = 200
[[redirects]]
  from = "/resources"
  to = "/resources.html"
  status = 200
[[redirects]]
  from = "/feed"
  to = "/feed.xml"
  status = 200
[[redirects]]
  from = "/rss"
  to = "/feed.xml"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
[[redirects]]
  from = "/thanks"
  to = "/thanks.html"
  status = 200
